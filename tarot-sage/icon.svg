<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533"/>
      <stop offset="100%" style="stop-color:#0d001a"/>
    </linearGradient>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- 星星 -->
  <circle cx="20" cy="15" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="80" cy="25" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="15" cy="85" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="85" cy="80" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="50" cy="10" r="1" fill="#fff" opacity="0.4"/>
  <!-- 月亮 -->
  <circle cx="50" cy="40" r="18" fill="url(#moon)" opacity="0.9"/>
  <circle cx="58" cy="35" r="15" fill="#1a0533"/>
  <!-- 塔罗牌 -->
  <rect x="30" y="52" width="40" height="28" rx="3" fill="#2d1b4e" stroke="#c084fc" stroke-width="1.5" opacity="0.9"/>
  <text x="50" y="72" text-anchor="middle" fill="#c084fc" font-size="10" font-family="serif">☽</text>
  <!-- 神秘符号 -->
  <text x="50" y="90" text-anchor="middle" fill="#7c3aed" font-size="8" font-family="serif" opacity="0.7">✦ ✦ ✦</text>
</svg>