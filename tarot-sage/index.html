<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔮 灵犀智者 · 塔罗占卜</title>
<style>
  :root {
    --bg-primary: #0d001a;
    --bg-secondary: #1a0a2e;
    --bg-card: #2d1b4e;
    --text-primary: #e2d5f0;
    --text-secondary: #a78bfa;
    --accent: #c084fc;
    --accent-glow: #7c3aed;
    --border: #4a1a6e;
    --error: #ef4444;
    --success: #22c55e;
  }
  .light-theme {
    --bg-primary: #f5f0ff;
    --bg-secondary: #ede5ff;
    --bg-card: #ffffff;
    --text-primary: #1a1a2e;
    --text-secondary: #7c3aed;
    --accent: #7c3aed;
    --accent-glow: #a78bfa;
    --border: #d4c4f0;
    --error: #dc2626;
    --success: #16a34a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Noto Serif SC', serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.5s, color 0.5s;
  }
  #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
  .star {
    position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%;
    animation: twinkle var(--duration) ease-in-out infinite; opacity: 0;
  }
  @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:var(--max-opacity,0.8)} }
  #themeToggle {
    position: fixed; top: 15px; right: 15px; z-index: 100;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--accent); width: 40px; height: 40px;
    border-radius: 50%; cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; box-shadow: 0 0 15px rgba(124,58,237,0.3);
  }
  #themeToggle:hover { transform: scale(1.1); box-shadow: 0 0 25px rgba(124,58,237,0.5); }
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }
  .header { text-align: center; padding: 30px 0 20px; }
  .header h1 { font-size: 2.2em; color: var(--accent); text-shadow: 0 0 20px rgba(192,132,252,0.5); margin-bottom: 10px; }
  .header p { color: var(--text-secondary); font-size: 1.1em; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 25px; margin-bottom: 20px;
    backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .card-title { font-size: 1.3em; color: var(--accent); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 0.95em; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 14px;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-primary);
    font-size: 1em; font-family: inherit; transition: border-color 0.3s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(192,132,252,0.3);
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-group select { cursor: pointer; }
  .form-group select option { background: var(--bg-secondary); color: var(--text-primary); }
  .style-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .style-btn {
    flex: 1; min-width: 100px; padding: 10px;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-primary); cursor: pointer;
    text-align: center; transition: all 0.3s; font-size: 0.95em;
  }
  .style-btn:hover { border-color: var(--accent); }
  .style-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px rgba(192,132,252,0.4); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 28px; border: none; border-radius: 12px;
    font-size: 1.05em; font-family: inherit; cursor: pointer;
    transition: all 0.3s; font-weight: bold;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-glow)); color: #fff; box-shadow: 0 4px 15px rgba(124,58,237,0.4); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(124,58,237,0.6); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; box-shadow: 0 4px 15px rgba(34,197,94,0.4); }
  .btn-success:hover { transform: translateY(-2px); }
  .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
  .overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 200;
    justify-content: center; align-items: center;
  }
  .overlay.show { display: flex; }
  .overlay-content {
    background: var(--bg-card); border: 1px solid var(--accent);
    border-radius: 20px; padding: 40px; max-width: 450px;
    text-align: center; box-shadow: 0 0 50px rgba(192,132,252,0.3);
    animation: fadeInUp 0.5s ease;
  }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  .overlay-content h2 { color: var(--accent); margin-bottom: 15px; font-size: 1.5em; }
  .overlay-content p { color: var(--text-secondary); margin-bottom: 10px; line-height: 1.6; }
  .overlay-content .ritual-icon { font-size: 4em; margin-bottom: 15px; display: block; }
  .overlay-content .countdown { font-size: 2em; color: var(--accent); margin: 15px 0; }
  #shuffleSection { display: none; text-align: center; padding: 60px 20px; }
  #shuffleSection.show { display: block; }
  .shuffle-animation {
    width: 80px; height: 120px; margin: 20px auto;
    background: linear-gradient(135deg, var(--accent), var(--accent-glow));
    border-radius: 8px; animation: shufflePulse 0.5s ease-in-out infinite alternate;
    display: flex; align-items: center; justify-content: center; font-size: 2em; color: #fff;
  }
  @keyframes shufflePulse { 0%{transform:translateY(0) rotate(-5deg)} 100%{transform:translateY(-15px) rotate(5deg)} }
  #shuffleSection h2 { color: var(--accent); margin-bottom: 10px; }
  #shuffleSection p { color: var(--text-secondary); }
  #loadingSection { display: none; text-align: center; padding: 40px 20px; }
  #loadingSection.show { display: block; }
  .loading-spinner {
    width: 50px; height: 50px; margin: 20px auto;
    border: 3px solid var(--border); border-top: 3px solid var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  #resultSection { display: none; }
  #resultSection.show { display: block; }
  .cards-display { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
  .tarot-card {
    width: 200px; background: var(--bg-secondary);
    border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; transition: all 0.5s; animation: cardFlip 0.6s ease;
  }
  .tarot-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(192,132,252,0.3); }
  @keyframes cardFlip { 0%{transform:rotateY(180deg) scale(0.8);opacity:0} 100%{transform:rotateY(0deg) scale(1);opacity:1} }
  .tarot-card .card-art { width: 100%; height: 280px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); }
  .tarot-card .card-art img { width: 100%; height: 100%; object-fit: cover; }
  .tarot-card .card-info { padding: 12px; text-align: center; }
  .tarot-card .card-info .card-name { font-size: 1.1em; color: var(--accent); font-weight: bold; }
  .tarot-card .card-info .card-position { font-size: 0.85em; color: var(--text-secondary); margin: 4px 0; }
  .tarot-card .card-info .card-orientation { font-size: 0.9em; padding: 2px 10px; border-radius: 10px; display: inline-block; margin-top: 4px; }
  .tarot-card .card-info .card-orientation.upright { background: rgba(34,197,94,0.2); color: #22c55e; }
  .tarot-card .card-info .card-orientation.reversed { background: rgba(239,68,68,0.2); color: #ef4444; }
  .tarot-card.reversed .card-art img { transform: rotate(180deg); }
  .reading-content {
    background: var(--bg-secondary); border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 25px; margin: 20px 0;
    line-height: 1.9; white-space: pre-wrap; font-size: 1em;
  }
  #errorSection { display: none; text-align: center; padding: 40px 20px; }
  #errorSection.show { display: block; }
  .error-icon { font-size: 4em; margin-bottom: 15px; }
  .error-message { color: var(--error); margin-bottom: 15px; }
  .mode-badge { display: inline-block; background: rgba(192,132,252,0.15); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 0.8em; margin-bottom: 10px; }
  .required::after { content: ' *'; color: var(--error); }
  .field-error { border-color: var(--error) !important; box-shadow: 0 0 10px rgba(239,68,68,0.3) !important; }
  .error-text { color: var(--error); font-size: 0.85em; margin-top: 4px; display: none; }
  .error-text.show { display: block; }
  #pickCardsSection { display: none; }
  #pickCardsSection.show { display: block; }
  .pick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px; margin: 15px 0; max-height: 500px; overflow-y: auto;
    padding: 10px; background: var(--bg-secondary); border-radius: 12px;
  }
  .pick-card {
    aspect-ratio: 2/3; background: var(--bg-primary);
    border: 2px solid var(--border); border-radius: 8px; cursor: pointer;
    transition: all 0.3s; position: relative; display: flex;
    align-items: center; justify-content: center; font-size: 2em; overflow: hidden;
  }
  .pick-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(192,132,252,0.3); }
  .pick-card.selected { border-color: var(--success); box-shadow: 0 0 15px rgba(34,197,94,0.4); transform: translateY(-5px); }
  .pick-card .pick-check {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
    background: var(--success); border-radius: 50%; display: none;
    align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: bold;
  }
  .pick-card.selected .pick-check { display: flex; }
  .pick-card img { width: 100%; height: 100%; object-fit: cover; }
  .pick-card .card-back {
    width: 100%; height: 100%; background: linear-gradient(135deg, #4a1a6e, #2d1b4e);
    display: flex; align-items: center; justify-content: center; font-size: 2em;
  }
  .pick-card.flipped img { display: block; }
  .pick-card.flipped .card-back { display: none; }
  .pick-card:not(.flipped) img { display: none; }
  .pick-card:not(.flipped) .card-back { display: flex; }
  .pick-counter { text-align: center; color: var(--text-secondary); margin: 10px 0; font-size: 0.95em; }
  #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  @media (max-width: 768px) {
    .container { padding: 10px; }
    .header h1 { font-size: 1.6em; }
    .tarot-card { width: 150px; }
    .tarot-card .card-art { height: 210px; }
    .style-group { flex-direction: column; }
    .style-btn { min-width: auto; }
    .btn-group { flex-direction: column; }
    .btn { width: 100%; }
    .pick-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
  }
  @media (max-width: 480px) {
    .tarot-card { width: 130px; }
    .tarot-card .card-art { height: 180px; }
    .overlay-content { margin: 20px; padding: 25px; }
    .pick-grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 5px; }
  }
  .hidden { display: none !important; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>
<div id="stars"></div>
<canvas id="particleCanvas"></canvas>
<button id="themeToggle" onclick="toggleTheme()" title="切换主题">🌙</button>
<div class="container">
  <div id="welcomeSection" class="header">
    <h1>🔮 灵犀智者</h1>
    <p>赛博空间的神秘塔罗解读者</p>
    <p style="color:var(--text-secondary);font-size:0.9em;margin-top:5px;">🌙 韦特塔罗78张牌 · 灵犀通灵占卜 🌙</p>
    <div id="modeIndicator" class="mode-badge" style="margin-top:10px;">🔮 灵犀已通 · 天机可测</div>
  </div>
  <div id="formSection" class="card">
    <div class="card-title">📋 占卜设置</div>
    <div class="form-group">
      <label>解读风格</label>
      <div class="style-group" id="styleGroup">
        <button class="style-btn active" data-style="friend" onclick="setStyle('friend')">🤝 朋友闲聊</button>
        <button class="style-btn" data-style="mentor" onclick="setStyle('mentor')">🧙 人生导师</button>
        <button class="style-btn" data-style="sharp" onclick="setStyle('sharp')">⚡ 犀利直给</button>
      </div>
    </div>
    <div class="form-group">
      <label>占卜模式</label>
      <select id="modeSelect" onchange="onModeChange()">
        <option value="detailed">📜 详细占卜</option>
        <option value="quick">⚡ 快捷占卜</option>
        <option value="daily">🌅 今日运势</option>
      </select>
    </div>
    <div class="form-group" id="spreadGroup">
      <label>牌阵选择</label>
      <select id="spreadSelect">
        <option value="body-mind-spirit">🧘 身·心·灵</option>
        <option value="situation-obstacle-outcome">🛤️ 现状·阻碍·出路</option>
        <option value="you-them-us">💑 你·TA·我们</option>
        <option value="yesterday-today-tomorrow">⏳ 昨日·今日·明日</option>
      </select>
    </div>
    <div class="form-group" id="questionGroup">
      <label class="required">你的问题</label>
      <textarea id="questionInput" placeholder="请输入你想问的问题，我会结合塔罗牌为你详细解读……" maxlength="200"></textarea>
      <div class="error-text" id="questionError">请先输入你的问题</div>
    </div>
    <div class="form-group">
      <label>你的星座（可选）</label>
      <select id="zodiacSelect">
        <option value="">—— 请选择 ——</option>
        <option value="白羊座">♈ 白羊座 (3.21-4.19)</option>
        <option value="金牛座">♉ 金牛座 (4.20-5.20)</option>
        <option value="双子座">♊ 双子座 (5.21-6.21)</option>
        <option value="巨蟹座">♋ 巨蟹座 (6.22-7.22)</option>
        <option value="狮子座">♌ 狮子座 (7.23-8.22)</option>
        <option value="处女座">♍ 处女座 (8.23-9.22)</option>
        <option value="天秤座">♎ 天秤座 (9.23-10.23)</option>
        <option value="天蝎座">♏ 天蝎座 (10.24-11.22)</option>
        <option value="射手座">♐ 射手座 (11.23-12.21)</option>
        <option value="摩羯座">♑ 摩羯座 (12.22-1.19)</option>
        <option value="水瓶座">♒ 水瓶座 (1.20-2.18)</option>
        <option value="双鱼座">♓ 双鱼座 (2.19-3.20)</option>
      </select>
    </div>
    <div class="form-group">
      <label>当前心情（可选）</label>
      <select id="moodSelect">
        <option value="">—— 请选择 ——</option>
        <option value="平静">😌 平静</option>
        <option value="快乐">😊 快乐</option>
        <option value="焦虑">😰 焦虑</option>
        <option value="悲伤">😢 悲伤</option>
        <option value="愤怒">😠 愤怒</option>
        <option value="期待">🤩 期待</option>
        <option value="迷茫">😕 迷茫</option>
        <option value="感恩">🙏 感恩</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="beginRitual()" style="width:100%;margin-top:10px;">
      🔮 开始占卜
    </button>
  </div>
  <div id="ritualOverlay" class="overlay">
    <div class="overlay-content">
      <span class="ritual-icon">🌙</span>
      <h2>静心连接</h2>
      <p>请闭上双眼，深呼吸三次……</p>
      <p>在心中默念你的问题，感受宇宙的能量。</p>
      <p>当你准备好时，占卜将自动开始。</p>
      <div class="countdown" id="countdown">3</div>
      <p style="font-size:0.85em;color:var(--text-secondary);">✨ 正在连接宇宙能量 ✨</p>
    </div>
  </div>
  <div id="shuffleSection">
    <div class="shuffle-animation">🃏</div>
    <h2>🔮 洗牌中……</h2>
    <p>塔罗牌正在宇宙能量中流转</p>
  </div>
  <div id="pickCardsSection" class="card">
    <div class="card-title">🃏 请选择三张牌 <span style="font-size:0.7em;color:var(--text-secondary);">（已选: <span id="pickCount">0</span>/3）</span></div>
    <p style="color:var(--text-secondary);font-size:0.9em;margin-bottom:10px;">点击牌面选择你心仪的塔罗牌，选满三张后点击确认</p>
    <div class="pick-grid" id="pickGrid"></div>
    <div class="pick-counter" id="pickCounter">请选择3张塔罗牌</div>
    <button class="btn btn-primary" id="confirmPickBtn" onclick="confirmPick()" disabled style="width:100%;">✅ 确认选牌（0/3）</button>
  </div>
  <div id="loadingSection">
    <div class="loading-spinner"></div>
    <h2>🔮 通灵解读中……</h2>
    <p>灵犀智者正在连接宇宙能量，解读星辰的讯息……</p>
  </div>
  <div id="errorSection" class="card">
    <div class="error-icon">😔</div>
    <h2 class="error-message" id="errorMessage">占卜过程中出现了一些问题</h2>
    <button class="btn btn-primary" onclick="retryReading()">🔄 重新占卜</button>
  </div>
  <div id="resultSection">
    <div class="card">
      <div class="card-title">🔮 占卜结果</div>
      <div id="resultMeta" style="text-align:center;margin-bottom:15px;color:var(--text-secondary);font-size:0.9em;"></div>
      <div class="cards-display" id="cardsDisplay"></div>
      <div class="reading-content" id="readingContent"></div>
      <div class="btn-group">
        <button class="btn btn-success" onclick="downloadReport()">📥 下载报告</button>
        <button class="btn btn-primary" onclick="redraw()">🔄 重新占卜</button>
        <button class="btn btn-secondary" onclick="goBack()">🏠 返回首页</button>
      </div>
    </div>
  </div>
</div>
<script>
// ============ 全局变量 ============
var currentStyle = 'friend';
var currentResult = null;
var pickedCards = [];
var allCardsData = [];
var particleAnimId = null;
// ============ AI API 配置 ============
var AI_CONFIG = {
  baseURL: 'https://api.trustoken.cn/v1',
  apiKey: '{{API_KEY}}',
  model: 'auto'
};
// ============ 塔罗牌数据 ============
var TAROT_CARDS = [
  {id:1,name:'愚人',type:'major',number:0,element:'风',keywords:'开始、冒险、天真、自由',meaning_upright:'新的开始，充满无限可能。放下过去，勇敢迈出第一步。',meaning_reversed:'鲁莽行事，冒险冲动，需要三思而后行。'},
  {id:2,name:'魔术师',type:'major',number:1,element:'水',keywords:'创造、技能、自信、资源',meaning_upright:'你拥有实现目标所需的一切资源。发挥你的创造力。',meaning_reversed:'才华被埋没，缺乏方向，需要重新审视自己的才能。'},
  {id:3,name:'女祭司',type:'major',number:2,element:'水',keywords:'直觉、智慧、神秘、内在',meaning_upright:'倾听内心的声音，答案就在你的潜意识中。',meaning_reversed:'忽视直觉，表面化，需要深入探索内心。'},

function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);for(var i=0;i<particles.length;i++){var p=particles[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();for(var j=i+1;j<particles.length;j++){var p2=particles[j];var dx=p.x-p2.x;var dy=p.y-p2.y;var dist=Math.sqrt(dx*dx+dy*dy);if(dist<150){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.strokeStyle='hsla(270,60%,60%,'+(0.1*(1-dist/150))+')';ctx.lineWidth=0.5;ctx.stroke();}}}
